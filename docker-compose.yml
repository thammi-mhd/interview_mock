services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: intervuo_db
    environment:
      POSTGRES_DB: interview_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-thammi_9632}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intervuo_network

  # FastAPI Backend
  api:
    build: .
    container_name: intervuo_api
    # Override CMD for local development (hot-reload enabled)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app/app    # Mount only app/ for hot-reload (not venv, frontend, etc.)
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to point to the 'db' container instead of localhost
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-thammi_9632}@db:5432/interview_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - intervuo_network

  # Next.js Frontend
  frontend:
    build: ./frontend-next
    container_name: intervuo_frontend
    command: npm run dev
    volumes:
      - ./frontend-next:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    networks:
      - intervuo_network

volumes:
  postgres_data:

networks:
  intervuo_network:
    driver: bridge
